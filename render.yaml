# Render Blueprint: one free web service that serves both the API and the built React app.
# The database is external (Neon PostgreSQL); paste its connection string as DATABASE_URL when
# Render asks. Every merge into the branch below is built and deployed automatically.
services:
  - type: web
    name: forms-dashboard
    runtime: node
    plan: free
    # Same AWS region as the Neon database (us-east-2), so every query stays fast.
    region: ohio
    # Switch to main after the dev → main release.
    branch: dev
    autoDeploy: true
    # Dev dependencies are needed to build (Vite, TypeScript, tsup, Prisma CLI). Migrations run on
    # every deploy, so new ones reach the live database automatically; the build fails (and the
    # previous version stays online) if they can't be applied.
    buildCommand: npm ci --include=dev && npm run db:generate && npm run build && npm run db:deploy
    startCommand: npm start
    healthCheckPath: /api/v1/health
    envVars:
      - key: NODE_VERSION
        value: '22'
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      # A long random secret generated by Render; nobody needs to see or copy it.
      - key: JWT_ACCESS_SECRET
        generateValue: true
      # Cookies only over HTTPS (Render serves the app over HTTPS).
      - key: COOKIE_SECURE
        value: 'true'
      - key: LOG_LEVEL
        value: info
